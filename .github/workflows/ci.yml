name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: WeatherForecast.xcodeproj
  SCHEME: WeatherForecast

jobs:
  build:
    name: Build (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Pick iOS Simulator
        id: simulator
        run: |
          # Newest iPhone on the newest installed iOS runtime.
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")) as $v
              | .value[]
              | select(.name | startswith("iPhone"))
              | {udid, version: [($v.major | tonumber), ($v.minor | tonumber)]}]
            | sort_by(.version) | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test Modules package
        working-directory: Modules
        run: |
          xcodebuild test \
            -scheme Modules \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ../DerivedData/Modules \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
