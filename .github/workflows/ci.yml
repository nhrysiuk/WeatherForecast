name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: WeatherForecast.xcodeproj
  SCHEME: WeatherForecast

jobs:
  build:
    name: Build (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick iOS Simulator
        id: simulator
        working-directory: Modules
        run: |
          udid=$(xcodebuild -scheme Modules-Package -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | sed -E 's/.*id:([^,]+), OS:([^,]+),.*/\2 \1/' \
            | sort -V | tail -1 | cut -d' ' -f2 || true)
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test Modules package
        working-directory: Modules
        run: |
          xcodebuild test \
            -scheme Modules-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ../DerivedData/Modules \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Test app
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
